<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Monotonic decreasing stack — previous greater element</title>
  <desc id="desc">A sequence of eight vertical bars 2,10,3,7,1,6,2,5 scanned left to right. Bars 10,7,6 are retained as decreasing candidates; 5 is the current element and is added to the stack. The retained values are 10 greater than 7 greater than 6 greater than 5. The previous greater element for 5 is 6.</desc>

  <rect width="1200" height="760" fill="#FFFFFF"/>
  <!-- Header -->
  <text x="86" y="82" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="32" font-weight="700" letter-spacing="-1.0" fill="#202124">Keep a decreasing stack</text>
  <text x="86" y="121" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#74777D">Previous greater element to the left  ·  scan from left to right</text>

  <!-- section overlines -->
  <text x="87" y="184" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" letter-spacing="1.9" fill="#8D9299">PROCESSED PREFIX</text>
  <path d="M 86 197 H 988" fill="none" stroke="#E6E8EA" stroke-width="1.5"/>
  <text x="1019" y="184" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#2F6DE1">CURRENT</text>
  <path d="M 1008 197 H 1120" fill="none" stroke="#DCE7FF" stroke-width="1.5"/>

  <!-- chart geometry: x: 92 221 350 479 608 737 866 1020, bar width 82; baseline 522; 1 unit = 28px -->
  <path d="M 86 523 H 1120" fill="none" stroke="#D9DCDF" stroke-width="1.5"/>
  <!-- Light bars: discarded -->
  <rect x="92"  y="466" width="82" height="56" rx="8" fill="#E5E7EA"/>
  <rect x="350" y="438" width="82" height="84" rx="8" fill="#E5E7EA"/>
  <rect x="608" y="494" width="82" height="28" rx="8" fill="#E5E7EA"/>
  <rect x="866" y="466" width="82" height="56" rx="8" fill="#E5E7EA"/>
  <!-- Kept dark bars: decreasing from left to right -->
  <rect x="221" y="242" width="82" height="280" rx="8" fill="#25282D"/>
  <rect x="479" y="326" width="82" height="196" rx="8" fill="#25282D"/>
  <rect x="737" y="354" width="82" height="168" rx="8" fill="#25282D"/>
  <!-- The current value is appended after smaller candidates are removed -->
  <rect x="1020" y="382" width="82" height="140" rx="8" fill="#3A78E8"/>

  <!-- Dashed stair-like connector marks the surviving monotonic sequence -->
  <path d="M 262 230 L 520 314 L 778 342 L 1061 370" fill="none" stroke="#59636F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 9" opacity="0.62"/>
  <circle cx="262" cy="230" r="4.5" fill="#FFFFFF" stroke="#59636F" stroke-width="2"/>
  <circle cx="520" cy="314" r="4.5" fill="#FFFFFF" stroke="#59636F" stroke-width="2"/>
  <circle cx="778" cy="342" r="4.5" fill="#FFFFFF" stroke="#59636F" stroke-width="2"/>
  <circle cx="1061" cy="370" r="4.5" fill="#FFFFFF" stroke="#3A78E8" stroke-width="2"/>

  <!-- Values, all independently editable vector text -->
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="650" text-anchor="middle">
    <text x="133" y="498" fill="#868B92">2</text>
    <text x="262" y="279" fill="#FFFFFF">10</text>
    <text x="391" y="470" fill="#868B92">3</text>
    <text x="520" y="361" fill="#FFFFFF">7</text>
    <text x="649" y="516" fill="#868B92">1</text>
    <text x="778" y="390" fill="#FFFFFF">6</text>
    <text x="907" y="498" fill="#868B92">2</text>
    <text x="1061" y="417" fill="#FFFFFF">5</text>
  </g>

  <!-- Group labels below chart -->
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">
    <rect x="88" y="556" width="14" height="14" rx="4" fill="#E5E7EA"/>
    <text x="111" y="568" fill="#797D84">Discarded — a closer, larger bar replaces them</text>
    <rect x="638" y="556" width="14" height="14" rx="4" fill="#25282D"/>
    <text x="661" y="568" fill="#45494F">Kept in decreasing order</text>
    <rect x="918" y="556" width="14" height="14" rx="4" fill="#3A78E8"/>
    <text x="941" y="568" fill="#45494F">Current element</text>
  </g>

  <!-- Explanation area: two lines, spacious Notion styling -->
  <path d="M 86 606 H 1120" fill="none" stroke="#ECEDEF" stroke-width="1.5"/>
  <text x="87" y="650" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#24272B">Stack after processing 5</text>
  <text x="87" y="677" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#81868D">Only decreasing candidates survive.</text>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27" font-weight="650" text-anchor="middle">
    <text x="579" y="665" fill="#2D3137">10</text>
    <text x="635" y="665" fill="#B3B7BC">&gt;</text>
    <text x="688" y="665" fill="#2D3137">7</text>
    <text x="735" y="665" fill="#B3B7BC">&gt;</text>
    <text x="783" y="665" fill="#2D3137">6</text>
    <text x="831" y="665" fill="#B3B7BC">&gt;</text>
    <text x="880" y="665" fill="#3A78E8">5</text>
  </g>
  <text x="87" y="723" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#69717B">For the current value 5, the nearest greater element on the left is <tspan fill="#25282D" font-weight="700">6</tspan>.</text>
</svg>
